<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add/Edit Genre | Library Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">Online Library</div>
  <nav class="sidebar-links">
    <a href="book-list.html">Books</a>
    <a href="author-list.html">Authors</a>
    <a href="genre-list.html" class="active">Genres</a>
  </nav>
  <div class="sidebar-footer">
    <span id="sessionInfo"></span>
    <button onclick="logout()" class="logout-btn">Logout</button>
  </div>
</aside>

<main class="main-content">
<div class="container narrow">
  <a href="genre-list.html" class="back-link">← Back to Genre List</a>
  <div class="form-card">
    <h1 id="formTitle">Add New Genre</h1>
    <div class="error-box" id="errorBox" style="display:none;"></div>

    <form id="genreForm">
      <label for="name">Genre Name</label>
      <input type="text" id="name" name="name" required>

      <div class="form-actions">
        <button type="submit" class="primary-btn">Save Genre</button>
        <a href="genre-list.html" class="cancel-btn">Cancel</a>
      </div>
    </form>
  </div>
</div>
</main>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/genre-form.js"></script>
</body>
</html>
