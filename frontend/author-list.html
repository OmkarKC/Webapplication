<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">Online Library</div>
  <nav class="sidebar-links">
    <a href="book-list.html">Books</a>
    <a href="author-list.html" class="active">Authors</a>
    <a href="genre-list.html">Genres</a>
  </nav>
  <div class="sidebar-footer">
    <span id="sessionInfo"></span>
    <button onclick="logout()" class="logout-btn">Logout</button>

      <thead>

<script src="js/storage.js"></script>
