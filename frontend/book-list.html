<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book List | Library Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">Online Library</div>
  <nav class="sidebar-links">
    <a href="book-list.html" class="active">Books</a>
    <a href="author-list.html">Authors</a>
    <a href="genre-list.html">Genres</a>
  </nav>
  <div class="sidebar-footer">
    <span id="sessionInfo"></span>
    <button onclick="logout()" class="logout-btn">Logout</button>
  </div>
</aside>

<main class="main-content">
<div class="container">
  <div class="topbar">
    <h1>Book List</h1>
  </div>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by title...">
      <button type="button" class="search-btn" title="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
    <select id="genreFilter">
      <option value="">All Genres</option>
    </select>
    <a href="book-form.html" class="add-btn" style="margin-left:auto;">+ Add New Book</a>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Cover</th>
          <th>Title</th>
          <th>Author</th>
          <th>Genre</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="bookTableBody"></tbody>
    </table>
    <div class="no-results" id="noResults" style="display:none;"></div>
  </div>
</div>
</main>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/book-list.js"></script>
</body>
</html>
